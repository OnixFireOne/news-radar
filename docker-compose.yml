version: '3.8'

services:

  # ─────────────────────────────────────────
  # CHROMADB — vector store for semantic search
  # Phase 1: stores BGE-m3 embeddings of all analyzed messages
  # Accessible inside Docker network at chromadb:8000
  # Exposed on host at localhost:8200 for debugging
  # ─────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: news-radar-chroma
    ports:
      - "8200:8000"
    volumes:
      - ./data/chroma:/chroma/chroma   # persistent vector data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - news-radar-network

  # ─────────────────────────────────────────
  # COLLECTOR — userbot читает Telegram каналы
  # ─────────────────────────────────────────
  collector:
    build:
      context: .          # корень проекта — видит все папки
      dockerfile: collectors/Dockerfile
    container_name: news-radar-collector
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./data/sessions:/app/sessions
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - news-radar-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────
  # ANALYZER — AI анализ через Oobabooga + embeddings через BGE-m3
  # depends_on chromadb: сначала поднимается хранилище векторов
  # data/models volume: BGE-m3 (~570MB) кэшируется между пересборками
  # ─────────────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    container_name: news-radar-analyzer
    depends_on:
      - chromadb
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./data/models:/app/data/models   # HuggingFace model cache (BGE-m3 survives rebuilds)
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - news-radar-network
      - openclaw-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────
  # API — FastAPI backend
  # Phase 1: includes /search, /similar, /duplicates endpoints
  # ─────────────────────────────────────────
  news-radar-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: news-radar-api
    depends_on:
      - chromadb
    env_file: .env
    ports:
      - "8100:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./data/models:/root/.cache/chroma   # ChromaDB ONNX model cache (survives rebuilds)
    restart: unless-stopped
    networks:
      - news-radar-network
      - openclaw-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────────
  # TELEGRAM BOT — вывод дайджестов
  # ─────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: news-radar-bot
    depends_on:
      - news-radar-api
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - API_URL=http://news-radar-api:8000
    restart: unless-stopped
    networks:
      - news-radar-network
      - openclaw-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  news-radar-network:
    driver: bridge
  openclaw-net:
    external: true

