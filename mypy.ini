[mypy-tests.test_bot_digest_stats]
strict = True

[mypy-tests.eval_ad_flags]
strict = True

[mypy-tests.test_eval_ad_flags]
strict = True

[mypy-tests.test_bot_misfire]
strict = True

[mypy-tests.test_knowledge_batch]
strict = True

[mypy-tests.test_knowledge_publisher_full]
