[mypy-tests.test_api_digest_errors]
strict = True

[mypy-analyzer.usage_store]
strict = True

[mypy-analyzer.digest_stats]
strict = True

[mypy-tests.test_usage_store]
strict = True

[mypy-tests.test_digest_stats]
strict = True

[mypy-tests.test_api_digest_stats]
