[mypy]
python_version = 3.11
# Start strict on the modules most likely to have type bugs (the pipeline core)
files = analyzer/analyzer.py, analyzer/trend_tracker.py, analyzer/llm_client.py, database/schema.py

# ── Error level ──────────────────────────────────────────────────────────────
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True       # str | None must be explicit, not str = None

# ── Imports from untyped 3rd-party libs (chromadb, hdbscan etc.) ─────────────
ignore_missing_imports = True

# ── Per-module overrides — relax gradually as we add stubs ───────────────────
[mypy-hdbscan.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True
