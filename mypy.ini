[mypy]
python_version = 3.11
# Start strict on the modules most likely to have type bugs (the pipeline core)
files = analyzer/value_funnel.py, analyzer/analyzer.py, analyzer/trend_tracker.py, analyzer/llm_client.py, analyzer/llm_local.py, analyzer/value_classifier.py, analyzer/jev_classifier.py, tests/eval_value_scoring.py, tests/test_llm_decisions.py, tests/test_jev_classifier.py, database/schema.py, llm_core,
        collectors/fulltext_fetcher.py, collectors/rss.py, collectors/hackernews.py, collectors/poll_runner.py,
        collectors/url_utils.py, tests/golden/refetch_fulltext.py, tests/collector/test_fulltext_always.py,
        tests/test_eval_fulltext.py, analyzer/knowledge_publisher.py,
        tests/test_renderer_ai_value.py, tests/test_knowledge_publisher.py, tests/test_digest_ai_value.py,
        tests/test_pipeline_characterization.py, tests/test_pipeline_registry.py,
        analyzer/pipeline/context.py, analyzer/pipeline/registry.py, analyzer/pipeline/legacy.py,
        analyzer/pipeline/analyzers.py, analyzer/pipeline/store.py, analyzer/pipeline/hooks.py,
        analyzer/pipeline/selectors.py, analyzer/pipeline/extras.py, analyzer/pipeline/writers.py,
        analyzer/pipeline/categories.py, bot/digest_schedule.py,
        tests/test_categories.py, tests/test_digests_named.py, tests/test_bot_named.py, tests/test_api_named.py, tests/test_bot_split.py, tests/test_bot_misfire.py, tests/test_knowledge_batch.py, tests/test_knowledge_publisher_full.py, tests/test_digest_carryover.py,
        tests/test_embeddings_hook.py, tests/test_api_digest_errors.py,
        analyzer/usage_store.py, analyzer/digest_stats.py, tests/test_usage_store.py,
        tests/test_digest_stats.py, tests/test_api_digest_stats.py, tests/test_bot_digest_stats.py,
        tests/eval_ad_flags.py, tests/test_eval_ad_flags.py,
        tests/test_digest_candidates.py, analyzer/json_schemas.py, tests/test_strict_json.py

# analyzer/, database/, config/ etc. have no __init__.py (implicit namespace
# packages). Without this, mypy resolves the same file two different ways
# (e.g. "llm_client" from `files=` vs "analyzer.llm_client" via an import
# elsewhere) and aborts with "Source file found twice under different module
# names". explicit_package_bases + mypy_path tells it to resolve module
# names from the project root instead of guessing — no runtime import change.
mypy_path = .
explicit_package_bases = True

# ── Error level ──────────────────────────────────────────────────────────────
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
# str | None must be explicit, not str = None
no_implicit_optional = True

# ── Imports from untyped 3rd-party libs (chromadb, hdbscan etc.) ─────────────
ignore_missing_imports = True

# ── Per-module overrides — relax gradually as we add stubs ───────────────────
[mypy-hdbscan.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

# ── ТЗ #4: llm_core is a new, self-contained package — hold it to --strict.
# The rest of the codebase is intentionally NOT converted wholesale.
[mypy-llm_core.*]
strict = True

[mypy-analyzer.llm_local]
strict = True

[mypy-analyzer.value_classifier]
strict = True

[mypy-analyzer.jev_classifier]
strict = True

[mypy-tests.test_llm_decisions]
strict = True

[mypy-tests.test_jev_classifier]
strict = True

[mypy-tests.eval_value_scoring]
strict = True

[mypy-tests.golden.refetch_fulltext]
strict = True

[mypy-tests.collector.test_fulltext_always]
strict = True

[mypy-tests.test_eval_fulltext]
strict = True

# ── ТЗ #4 И2: new collector modules — new file = --strict from day one.
[mypy-collectors.fulltext_fetcher]
strict = True

[mypy-collectors.rss]
strict = True

[mypy-collectors.hackernews]
strict = True

[mypy-collectors.poll_runner]
strict = True

[mypy-collectors.url_utils]
strict = True

[mypy-feedparser.*]
ignore_missing_imports = True

[mypy-trafilatura.*]
ignore_missing_imports = True

# ── Legacy baseline — разгребём отдельно ──────────────────────────────────────
# Pre-existing type errors that predate ТЗ #4 (verified via `git show HEAD:...`
# against the commit before this work started). Not fixed here per the rule:
# no mass conversion of existing code. Ignored per-module so `python -m mypy`
# is green end-to-end; strictness stays scoped to llm_core/ and new code.
[mypy-analyzer.trend_tracker]
ignore_errors = True

[mypy-analyzer.chroma_client]
ignore_errors = True

[mypy-analyzer.embedder]
ignore_errors = True

[mypy-analyzer.renderer]
ignore_errors = True

[mypy-config.config_watcher]
ignore_errors = True

# database.schema is NOT baselined: its 2 pre-existing errors were fixed
# directly (see get_db()) so migrations we add in И1-И4 stay type-checked.

[mypy-analyzer.value_funnel]
strict = True

[mypy-analyzer.knowledge_publisher]
strict = True

[mypy-tests.test_renderer_ai_value]
strict = True

[mypy-tests.test_knowledge_publisher]
strict = True

[mypy-tests.test_digest_ai_value]
strict = True

[mypy-tests.test_pipeline_characterization]
