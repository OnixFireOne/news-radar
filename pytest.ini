[pytest]
asyncio_mode = auto
addopts = -v --tb=short
pythonpath = .
# Restrict discovery to tests/ — without this, pytest scans the whole /app
# in the analyzer container, including the bind-mounted ./data (runtime DB,
# ad-hoc debug scripts, etc.) and tries to collect anything matching *_test.py.
testpaths = tests
# tests/collector/ needs feedparser/trafilatura (collectors/requirements.txt)
# and must run in the collector image; everything else needs analyzer's deps
# (chromadb, sentence-transformers) and must run in the analyzer image.
# Neither image has both, so run analyzer tests with `--ignore=tests/collector`
# and collector tests as `pytest tests/collector` — see README / iteration
# reports for the exact docker compose commands.
